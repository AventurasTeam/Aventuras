name: Pre-release

on:
  push:
    tags:
      - 'v*-pre*' # v0.5.5-pre.1
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.release.outputs.id }}
      version: ${{ steps.guard.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Refuse a published release
        id: guard
        uses: ./.github/actions/release-guard
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Created once here so the parallel build jobs upload to a known release instead of
      # racing each other to find-or-create it (which produces duplicate drafts). Stays a
      # draft — invisible to /releases/latest — until the publish job below confirms every
      # build succeeded. body is left unset on a re-run (state == draft) so softprops keeps
      # whatever notes were already typed into the draft instead of overwriting them.
      - name: Create or reuse pre-release draft
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.guard.outputs.version }}
          name: 'Aventuras v${{ steps.guard.outputs.version }}'
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: true
          body: ${{ steps.guard.outputs.state == 'draft' && '' || '**Pre-release build** — a test/preview release. Use at your own risk.' }}

  build-desktop:
    needs: create-release
    uses: ./.github/workflows/build-desktop.yml
    with:
      prerelease: true
      releaseId: ${{ needs.create-release.outputs.release-id }}
    secrets: inherit

  build-android:
    needs: create-release
    uses: ./.github/workflows/build-android.yml
    with:
      prerelease: true
    secrets: inherit

  publish:
    needs: [create-release, build-desktop, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.create-release.outputs.version }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
