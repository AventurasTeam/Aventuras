name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runners are pinned, not ubuntu-latest: that label moves to Ubuntu 26.04 from
# 2026-10-19, and Playwright < 1.61 can't install Chromium or its deps there
# (install-deps just warns and exits 0). Move the pin deliberately.
jobs:
  check:
    name: Lint, format, typecheck, docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
        with:
          save-cache: 'true'

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Lint docs (remark)
        run: pnpm lint:docs

      - name: Check migration consistency (drizzle-kit)
        run: pnpm db:check

      - name: Check migration file format
        run: pnpm db:check:format

      - name: Typecheck
        run: pnpm typecheck

      - name: React Compiler bail-out ratchet
        run: pnpm compiler:check

      - name: Typecheck Electron main
        run: pnpm electron:compile

  test:
    name: Storybook tests (vitest + playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      # Playwright browser binaries are ~170 MB. Each playwright-core release
      # pins its browser builds, so key on that version, not the lockfile.
      - name: Resolve Playwright version
        id: playwright
        run: |
          version=$(node -p "require('./node_modules/playwright-core/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright cache
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Run story tests
        run: pnpm test:run

  e2e:
    name: E2E (Playwright + Electron, packaged)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      # Electron binary + builder downloads (~100 MB); keyed on the two versions
      # that decide them, so an unrelated lockfile change keeps the cache.
      - name: Resolve Electron versions
        id: electron
        run: |
          versions=$(node -p "['electron', 'electron-builder'].map((p) => require('./node_modules/' + p + '/package.json').version).join('-')")
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

      - name: Restore Electron cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ steps.electron.outputs.versions }}

      - name: Build web bundle
        run: pnpm build:web

      - name: Compile Electron main
        run: pnpm electron:compile

      # --dir skips AppImage/deb compression but still produces the asar,
      # unpacked native modules, and extraResources migrations the packaged
      # tier exercises (docs/testing.md → CI).
      - name: Package desktop (unpacked)
        run: pnpm exec electron-builder --linux --dir

      # Electron needs Chromium's shared libraries; install-deps provides them
      # (and xvfb) without downloading a browser.
      - name: Install system libraries for Electron
        run: pnpm exec playwright install-deps chromium

      # Fixture embedder model (~24 MB from Hugging Face); the harness downloads
      # it on a cache miss. Keyed on the catalog so a model/revision bump busts.
      - name: Restore embedder model cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/aventuras-e2e
          key: e2e-embedder-${{ hashFiles('lib/embedder/catalog-data.json') }}

      # Electron has no true headless mode on Linux — the script wraps the run
      # in a virtual display (scripts/e2e.ts). The packaged project launches the
      # built binary; the harness seeds a throwaway userData per run.
      - name: Run E2E (packaged, headless via xvfb)
        run: pnpm test:e2e:packaged
