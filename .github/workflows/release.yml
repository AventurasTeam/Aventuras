name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Stable releases only (v1.0.0)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-desktop:
    uses: ./.github/workflows/build-desktop.yml
    with:
      prerelease: false
    secrets: inherit

  build-android:
    uses: ./.github/workflows/build-android.yml
    with:
      prerelease: false
    secrets: inherit
