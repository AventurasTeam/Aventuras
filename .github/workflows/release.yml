name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Stable releases only (v1.0.0)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.release.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Refuse a published release
        id: guard
        uses: ./.github/actions/release-guard
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Created once here so the parallel build jobs upload to a known release instead of
      # racing each other to find-or-create it (which produces duplicate drafts). body is
      # left unset on a re-run (state == draft) so softprops keeps whatever notes were
      # already typed into the draft instead of overwriting them. Publishing the draft
      # itself is still done by hand — see docs/development/release.md.
      - name: Create or reuse draft release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.guard.outputs.version }}
          name: 'Aventuras v${{ steps.guard.outputs.version }}'
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          body: ${{ steps.guard.outputs.state == 'draft' && '' || 'See the assets to download and install this version.' }}

  build-desktop:
    needs: create-release
    uses: ./.github/workflows/build-desktop.yml
    with:
      prerelease: false
      releaseId: ${{ needs.create-release.outputs.release-id }}
    secrets: inherit

  build-android:
    needs: create-release
    uses: ./.github/workflows/build-android.yml
    with:
      prerelease: false
    secrets: inherit
