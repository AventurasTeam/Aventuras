name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Stable releases only (v1.0.0)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-desktop:
    uses: ./.github/workflows/build-desktop.yml
    with:
      prerelease: false
    secrets: inherit

  build-android:
    uses: ./.github/workflows/build-android.yml
    with:
      prerelease: false
    secrets: inherit
