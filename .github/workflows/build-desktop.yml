name: Build Desktop

on:
  workflow_call:
    inputs:
      prerelease:
        description: 'Publish a pre-release; otherwise a draft release with updater metadata'
        type: boolean
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Desktop (${{ matrix.artifact_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows
          - platform: macos-latest
            target: x86_64-apple-darwin
            artifact_name: macos-intel
          - platform: macos-latest
            target: aarch64-apple-darwin
            artifact_name: macos-arm

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Aventura v__VERSION__'
          releaseBody: ${{ inputs.prerelease && '**Pre-release build** — a test/preview release. Use at your own risk.' || 'See the assets to download and install this version.' }}
          releaseDraft: ${{ !inputs.prerelease }}
          prerelease: ${{ inputs.prerelease }}
          includeUpdaterJson: ${{ !inputs.prerelease }}
          updaterJsonPreferNsis: true
          assetNamePattern: '[name]_${{ github.ref_name }}_[arch][setup][ext]'
          args: --target ${{ matrix.target }}
