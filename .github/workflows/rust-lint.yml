name: Rust Lint

on:
  pull_request:
    branches:
      - master
    paths:
      - 'src-tauri/**/*.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/rust-lint.yml'
      - 'scripts/ci/cargo-deps-hash.js'
  # Saves the Clippy cache in master's scope, the only one every PR can restore from.
  push:
    branches:
      - master
    paths:
      - 'src-tauri/**/*.rs'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - '.github/workflows/rust-lint.yml'
      - 'scripts/ci/cargo-deps-hash.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Pinned so a new stable's lints cannot fail an unrelated PR; keep in step with lint:rust in package.json.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy

      # In the restore prefix, so a dependency update starts cold instead of saving new
      # artifacts beside the old ones. See docs/development/ci-caching.md.
      - name: Hash Rust dependencies
        id: cargo-deps
        shell: bash
        run: echo "hash=$(node scripts/ci/cargo-deps-hash.js)" >> "$GITHUB_OUTPUT"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: clippy-${{ steps.cargo-deps.outputs.hash }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
