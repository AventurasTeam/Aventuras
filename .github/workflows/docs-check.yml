name: Docs check

# No path filter: decision anchors and doc paths in source files are checked too.
on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install npm dependencies
        uses: ./.github/actions/npm-install

      - name: Check decision records and docs
        run: npm run docs:check -- --strict
