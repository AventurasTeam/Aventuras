name: 'Rust cache'
description: >
  swatinem/rust-cache keyed on a hash of the Rust dependency set (scripts/ci/cargo-deps-hash.js),
  so a dependency change starts cold instead of saving new artifacts beside the old ones. Saves
  only on master. See docs/development/ci-caching.md#rust-cache-growth.

inputs:
  key:
    description: 'Per-job key prefix, e.g. the target triple'
    required: true
  working-directory:
    description: 'Project root holding src-tauri/'
    required: false
    default: '.'
  cache-directories:
    description: 'Extra paths to persist; not part of the key'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Hash Rust dependencies
      id: cargo-deps
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        hash=$(node scripts/ci/cargo-deps-hash.js)
        echo "hash=$hash" >> "$GITHUB_OUTPUT"

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        workspaces: '${{ inputs.working-directory }}/src-tauri -> target'
        key: ${{ inputs.key }}-${{ steps.cargo-deps.outputs.hash }}
        cache-directories: ${{ inputs.cache-directories }}
        save-if: ${{ github.ref == 'refs/heads/master' }}
