language: 'en-US'
early_access: true
reviews:
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  poem: true
  review_status: true
  review_details: true
  auto_review:
    enabled: true
    drafts: false
  sequence_diagrams: true
  path_filters:
    - '!**/node_modules/**'
    - '!**/android/**'
    - '!**/ios/**'
    - '!**/.expo/**'
    - '!**/.expo-shared/**'
    - '!**/dist/**'
    - '!**/docs/**'
    - '!**pnpm-lock.json'
    - '!**/lib/db/migrations/meta/**'
chat:
  auto_reply: true
