[package]
name = "aventura"
version = "0.7.12"
description = "AI-powered adventure and creative writing frontend"
authors = ["Contributors"]
edition = "2024"

[lib]
name = "aventura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
devtools = ["dep:tauri-plugin-devtools"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Defaults are off so the `cookies` jar stays out; the rest of them are listed again here.
# unsafe-headers lets httpFetch drop Origin and lifts the forbidden-header filter for every call.
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls", "http2", "charset", "system-proxy", "gzip", "brotli", "zstd", "unsafe-headers"] }
tauri-plugin-notification = "2"
tauri-plugin-generation = { path = "plugins/generation" }

# Local network sync
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync"] }
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.23"
local-ip-address = "0.6"
uuid = { version = "1", features = ["v4"] }
# rustls-no-provider: use the process-level ring provider installed in lib.rs
# (pulling reqwest's default `rustls` feature would add a second aws-lc-rs provider)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tauri-plugin-devtools = { version = "2", optional = true }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio"] }
hex = "0.4.3"
zip = { version = "9", default-features = false, features = ["deflate"] }
futures-util = "0.3"

# OS trust store on top of the bundled roots, Windows and Linux only. Android and iOS have no store
# rustls-native-certs can read; on macOS every request would walk the keychain.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
# default-features = false, or Cargo merges the defaults (cookies included) back in on these targets.
tauri-plugin-http = { version = "2", default-features = false, features = ["rustls-tls-native-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
